name: Test build

# Ручная сборка "на пробу" для установки на телефон.
#
# Запуск: Actions -> Test build -> Run workflow (можно выбрать вариант).
#
# В отличие от release-full-lite.yml, здесь НЕ поднимается версия и создаётся
# НЕ релиз, а предрелиз (prerelease) с тегом test-<номер>. GitHub API
# /releases/latest не отдаёт предрелизы, поэтому автопроверка обновлений
# в приложении такую сборку не увидит и не предложит её как обновление.
#
# Нужные секреты — те же, что для релиза:
#   API_ID, API_HASH, KEYSTORE_JKS, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   GOOGLE_SERVICES_JSON (опц.)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Что собирать"
        required: true
        default: full
        type: choice
        options:
          - full
          - lite
          - both

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Make gradlew executable
        run: chmod +x gradlew build-versions.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Добавьте секреты API_ID и API_HASH (my.telegram.org)"
            exit 1
          fi
          echo "apiId=$API_ID" >> local.properties
          echo "apiHash=$API_HASH" >> local.properties

      - name: Configure signing
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_JKS" ]; then
            echo "::error::Не задан секрет KEYSTORE_JKS. Подпись привязана к анти-тамперу"
            echo "::error::(TMessagesProj/jni/colorado/colorado.h) — debug-ключ приведёт к SIGKILL."
            exit 1
          fi
          echo "$KEYSTORE_JKS" | base64 --decode > keystore.jks
          {
            echo "storeFile=${{ github.workspace }}/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          fi

      - name: Build FULL
        if: ${{ github.event.inputs.variant != 'lite' }}
        run: |
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon -Pandroid.injected.testOnly=false
          mkdir -p dist
          for f in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            renamed="$(echo "$base" | sed -E 's/^(freshGram-[0-9.]+-[0-9]+)-/\1-full-/')"
            cp -f "$f" "dist/$renamed"
          done

      - name: Build LITE
        if: ${{ github.event.inputs.variant != 'full' }}
        run: |
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon \
            -Pandroid.injected.testOnly=false -PfreshgramLite=true
          for f in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            renamed="$(echo "$base" | sed -E 's/^(freshGram-[0-9.]+-[0-9]+)-/\1-lite-/')"
            cp -f "$f" "dist/$renamed"
          done

      - name: Show dist
        run: ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freshgram-test-apks
          path: dist/*.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: "freshGram test build #${{ github.run_number }} (${{ github.event.inputs.variant }})"
          draft: false
          prerelease: true
          body: |
            **Тестовая сборка** для проверки на телефоне.

            - Вариант: `${{ github.event.inputs.variant }}`
            - Коммит: `${{ github.sha }}`
            - Запуск: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > Это предрелиз. Приложение **не** увидит его через встроенную проверку обновлений
            > (`/releases/latest` не отдаёт предрелизы), поэтому обычный релиз останется стабильным.

            Установка:
            ```bash
            adb install -r freshGram-<версия>-<код>-<вариант>-arm64-v8a.apk
            ```
          files: |
            dist/freshGram-*.apk
          fail_on_unmatched_files: false
