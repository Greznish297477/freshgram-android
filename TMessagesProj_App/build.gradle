import com.android.build.api.variant.FilterConfiguration

plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
    id 'org.telegram.build-app-plugin'
    id 'io.sentry.android.gradle'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile project(':baselineprofile')
}

def freshgramProps = new Properties()
def freshgramPropsFile = rootProject.file('local.properties')
if (freshgramPropsFile.exists()) {
    freshgramPropsFile.withInputStream { freshgramProps.load(it) }
}
def freshgramSentryDsn = freshgramProps.getProperty('sentryDsn', '')

sentry {
    def sentryEnabled = freshgramSentryDsn != null && !freshgramSentryDsn.trim().isEmpty()
    autoUpload = sentryEnabled
    uploadNativeSymbols = sentryEnabled
    includeSourceContext = sentryEnabled
    additionalSourceDirsForSourceContext = [ '../TMessagesProj/src/main/java' ]
    autoInstallation {
        enabled = false
    }
    ignoredBuildTypes = ["debug"]
}

// Без DSN нечего загружать в Sentry — отключаем задачи, иначе assembleRelease падает.
tasks.configureEach { task ->
    if (freshgramSentryDsn == null || freshgramSentryDsn.trim().isEmpty()) {
        if (task.name.startsWith('uploadSentry') || task.name == 'sentryBundleSourcesRelease' || task.name == 'sentryGenerateProguardUuidRelease') {
            task.enabled = false
        }
    }
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    packagingOptions {
        resources {
            excludes += '**'
        }
    }

    Properties localProperties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    }

    androidResources {
        noCompress += "pack"
    }

    signingConfigs {
        if (localProperties.getProperty("storeFile") != null) {
            sign {
                storeFile file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.sign
            }
            applicationIdSuffix ".beta"
        }

        release {
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.sign
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel 'FULL'
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    defaultConfig {
        versionName APP_VERSION_NAME

        multiDexEnabled true

        manifestPlaceholders = [MAPS_API_KEY: localProperties.get("mapsApiKey")]
    }

    splits.abi {
        var buildingBundle = gradle.startParameter.taskNames.any { it.startsWith("bundle") }
        enable !buildingBundle
        universalApk true

        reset()
        include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
    namespace 'org.telegram.messenger.regular'

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def abiName = abi ?: "universal"
            def baseVersionCode = output.versionCode.get()
            output.outputFileName.set("freshGram-${output.versionName.get()}-${baseVersionCode}-${abiName}.apk")
            output.versionCode.set(baseVersionCode * 10)
        }
    }
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
