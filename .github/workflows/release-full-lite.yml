name: Release (full + lite)

# Собирает две версии приложения — full и lite — и публикует их
# отдельными APK в GitHub Release.
#
# Запуск:
#   * пуш тега вида v13.1.1 -> создаётся релиз с этим тегом;
#   * вручную (workflow_dispatch) -> релиз создаётся по тегу из поля tag.
#
# Lite-версия собирается с -PfreshgramLite=true (см. TMessagesProj/build.gradle,
# buildConfigField FRESHGRAM_LITE -> BuildVars.LITE). В ней выключены приватные
# фичи, которые нарушают политику Google Play.
#
# Нужные секреты репозитория:
#   API_ID, API_HASH                 — my.telegram.org
#   KEYSTORE_JKS, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD          — ключ подписи (base64 от .jks)
#   GOOGLE_SERVICES_JSON (опц.)      — base64 от google-services.json

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для релиза (например v13.1.1)"
        required: true
        type: string

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

jobs:
  build:
    name: Build full + lite
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Make gradlew executable
        run: chmod +x gradlew build-versions.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Добавьте секреты API_ID и API_HASH (my.telegram.org)"
            exit 1
          fi
          echo "apiId=$API_ID" >> local.properties
          echo "apiHash=$API_HASH" >> local.properties

      - name: Configure signing
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_JKS" ]; then
            echo "::error::Не задан секрет KEYSTORE_JKS. Подпись привязана к анти-тамперу"
            echo "::error::(TMessagesProj/jni/colorado/colorado.h) — debug-ключ приведёт к SIGKILL."
            exit 1
          fi
          echo "$KEYSTORE_JKS" | base64 --decode > keystore.jks
          {
            echo "storeFile=${{ github.workspace }}/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          fi

      - name: Build FULL
        run: |
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon -Pandroid.injected.testOnly=false
          mkdir -p dist
          for f in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            # freshGram-VER-CODE-ABI.apk -> freshGram-VER-CODE-full-ABI.apk
            renamed="$(echo "$base" | sed -E 's/^(freshGram-[0-9.]+-[0-9]+)-/\1-full-/')"
            cp -f "$f" "dist/$renamed"
          done

      - name: Build LITE
        run: |
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon \
            -Pandroid.injected.testOnly=false -PfreshgramLite=true
          for f in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            renamed="$(echo "$base" | sed -E 's/^(freshGram-[0-9.]+-[0-9]+)-/\1-lite-/')"
            cp -f "$f" "dist/$renamed"
          done

      - name: Show dist
        run: ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freshgram-apks
          path: dist/*.apk

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: freshgram-apks
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "freshGram ${{ steps.tag.outputs.name }} (full + lite)"
          draft: false
          prerelease: false
          body: |
            ## freshGram ${{ steps.tag.outputs.name }}

            Форк Telegram на базе Nekogram со сборками **full** и **lite**.

            | Файл | Версия | Описание |
            |---|---|---|
            | `freshGram-*-full-universal.apk` | full | Все ABI, полный набор функций |
            | `freshGram-*-full-arm64-v8a.apk` | full | Только arm64 (современные телефоны) |
            | `freshGram-*-full-armeabi-v7a.apk` | full | Только armv7 |
            | `freshGram-*-full-x86.apk` / `-x86_64.apk` | full | Эмуляторы и x86-устройства |
            | `freshGram-*-lite-universal.apk` | lite | Все ABI, без приватных фич (для Google Play) |
            | `freshGram-*-lite-arm64-v8a.apk` | lite | Только arm64 |
            | `freshGram-*-lite-armeabi-v7a.apk` | lite | Только armv7 |
            | `freshGram-*-lite-x86.apk` / `-x86_64.apk` | lite | Эмуляторы и x86-устройства |

            Если не знаете свой ABI — берите `universal`: он работает везде, но весит больше.

            **full vs lite.** Lite собран с `-PfreshgramLite=true`: отключены анти-удаление,
            режим призрака, «оставлять удалённые чаты», режим стримера, история правок,
            «сохранять удалённые сообщения» и выбор >100. Остальное (тема, брендинг,
            иконки, шрифты, порядок вкладок) одинаково.

            **Установка:**
            ```bash
            adb install -r freshGram-<версия>-<код>-full-universal.apk
            ```

            > full и lite используют один пакет `app.freshgram.android` — ставьте **одну** версию.
            > Смена ключа подписи без пересчёта `TMessagesProj/jni/colorado/colorado.h`
            > приведёт к SIGKILL при старте.
          files: |
            dist/freshGram-*-full-*.apk
            dist/freshGram-*-lite-*.apk
          fail_on_unmatched_files: false
